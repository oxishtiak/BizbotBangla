{% extends 'base.html' %}
{% block title %}নতুন পণ্য{% endblock %}
{% block content %}
<div class="page-header">
  <h1>+ নতুন পণ্য যোগ করুন</h1>
  <p><a href="{% url 'inventory' %}" style="color:#64748b;text-decoration:none">← পণ্য তালিকায় ফিরুন</a></p>
</div>
<div style="max-width:500px">
<div class="card card-pad">
  <form method="post">{% csrf_token %}
    <div class="form-group">
      <label>পণ্যের নাম *</label>
      <input type="text" name="name" class="form-control" placeholder="যেমন: চাল, ডিম, তেল" required>
    </div>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px">
      <div class="form-group">
        <label>বর্তমান স্টক</label>
        <input type="number" name="stock" class="form-control" value="0" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>একক</label>
        <select name="unit" class="form-select">
          <option>পিস</option><option>কেজি</option><option>লিটার</option>
          <option>ডজন</option><option>বস্তা</option><option>প্যাকেট</option>
        </select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label>ক্রয় মূল্য (৳)</label>
        <input type="number" name="buy_price" class="form-control" value="0" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>বিক্রয় মূল্য (৳)</label>
        <input type="number" name="sell_price" class="form-control" value="0" min="0" step="0.01">
      </div>
    </div>
    <div class="form-group">
      <label>কম স্টক সতর্কতা</label>
      <input type="number" name="low_stock_alert" class="form-control" value="0" min="0">
      <!-- ✅ default 0 — manually set না করলে alert আসবে না -->
      <div style="font-size:12px;color:#64748b;margin-top:4px">
        0 রাখলে কোনো সতর্কতা আসবে না। নির্দিষ্ট পরিমাণ দিলে তার নিচে গেলে সতর্কতা দেখাবে।
      </div>
    </div>
    <button type="submit" class="btn btn-green" style="width:100%;justify-content:center">✅ পণ্য সেভ করুন</button>
  </form>
</div>
</div>
{% endblock %}
